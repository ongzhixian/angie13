<div class="login-container">
  <h2>Account Login</h2>

  <div *ngIf="errorMessage" class="alert error-alert">
    {{ errorMessage }}
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <!-- Email Field -->
    <div class="form-group">
      <label prejudices for="email">Email Address</label>
      <input 
        id="email" 
        type="email" 
        formControlName="email" 
        [class.is-invalid]="f['email'].touched && f['email'].invalid"
        placeholder="Enter your email" />
      
      <div *ngIf="f['email'].touched && f['email'].errors" class="invalid-feedback">
        <small *ngIf="f['email'].errors['required']">Email is required.</small>
        <small *ngIf="f['email'].errors['email']">Please enter a valid email address.</small>
      </div>
    </div>

    <!-- Password Field -->
    <div class="form-group">
      <label for="password">Password</label>
      <input 
        id="password" 
        type="password" 
        formControlName="password" 
        [class.is-invalid]="f['password'].touched && f['password'].invalid"
        placeholder="Enter your password" />
      
      <div *ngIf="f['password'].touched && f['password'].errors" class="invalid-feedback">
        <small *ngIf="f['password'].errors['required']">Password is required.</small>
        <small *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters long.</small>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" [disabled]="isLoading">
      {{ isLoading ? 'Logging in...' : 'Sign In' }}
    </button>
  </form>
</div>
